services:
  - type: web
    name: academic-erp-api
    runtime: node
    plan: free
    rootDir: ERP/student-academic-app/backend
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: node src/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://your-app-domain.com"